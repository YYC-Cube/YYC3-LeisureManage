# YYC³ LeisureManage · GitHub Pages 部署
# 发布 public/ 为站点根(CNAME=lm.yyc3.vip 由 Pages 配置持有;index.html 为品牌落地页)
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署品牌站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物(public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
